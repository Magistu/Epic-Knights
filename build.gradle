plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'architectury-plugin' version '3.5.166'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        maven { url = "https://maven.terraformersmc.com/" }
    }
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }

        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // Add publishing repositories here if needed.
        }
    }
}

ext.minecraftGameVersions = {
    def parse = { String v ->
        def parts = v.tokenize('.')

        if (parts.size() < 2)
            throw new IllegalArgumentException(
                    "Version '${v}' must have at least major.minor"
            )

        [
                major: parts[0].toInteger(),
                minor: parts[1].toInteger(),
                patch: (parts.size() >= 3 ? parts[2].toInteger() : 0)
        ]
    }

    try {
        def min = parse(rootProject.minecraft_min_version.toString())
        def max = parse(rootProject.minecraft_max_version.toString())

        if (min.major != max.major || min.minor != max.minor) {
            logger.lifecycle(
                    "Different minor/major in range " +
                            "(${min.major}.${min.minor} .. ${max.major}.${max.minor}), " +
                            "falling back to current '${rootProject.minecraft_version}'"
            )

            return [rootProject.minecraft_version]
        }

        if (min.patch > max.patch) {
            logger.lifecycle(
                    "Min patch ${min.patch} > max patch ${max.patch}, " +
                            "falling back to current '${rootProject.minecraft_version}'"
            )

            return [rootProject.minecraft_version]
        }

        def result = []

        for (int p = min.patch; p < max.patch; p++) {
            result << (
                    p == 0
                            ? "${min.major}.${min.minor}"
                            : "${min.major}.${min.minor}.${p}"
            )
        }

        return result.unique()
    } catch (Exception e) {
        logger.lifecycle(
                "Failed to compute range: ${e.message}; " +
                        "falling back to current '${rootProject.minecraft_version}'"
        )

        return [rootProject.minecraft_version]
    }
}()